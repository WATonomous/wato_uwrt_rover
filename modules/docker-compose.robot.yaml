services:
  robot:
    build: &robot_build
      context: ..
      dockerfile: docker/robot/robot.Dockerfile
      cache_from:
        - "${ROBOT_IMAGE:?}:${TAG}"
        - "${ROBOT_IMAGE:?}:main"
      args:
        BASE_IMAGE: ${BASE_IMAGE_OVERRIDE-}
    image: "${ROBOT_IMAGE:?}:${TAG}"
    profiles:
      - deploy
    # SCENARIO: traverse (default), rock_field or sand_trap (src/robot/bringup_robot/config/scenarios)
    command: /bin/bash -c "ros2 launch bringup_robot robot.launch.py scenario:=${SCENARIO:-traverse}"

  robot_dev:
    build: *robot_build
    image: "${ROBOT_IMAGE:?}:dev_${TAG}"
    command: tail -F anything
    profiles:
      - develop
    # Paths match AMENT_WS=/ament_ws in docker/base/local_base.Dockerfile.
    volumes:
      - ${MONO_DIR}/src/robot:/ament_ws/src/robot
      - ${MONO_DIR}/src/common:/ament_ws/src/common
